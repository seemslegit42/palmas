<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E1015" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20B2AA" />
      <stop offset="50%" stop-color="#3EB991" />
      <stop offset="100%" stop-color="#E0218A" />
    </linearGradient>
    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A9D" />
      <stop offset="100%" stop-color="#8B1254" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(245, 255, 250, 0.12)" stroke-width="4" />

  <!-- Ambient Energy Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#20B2AA" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E0218A" stroke-width="2" stroke-opacity="0.2" />

  <!-- Central Palmos Motif: Stylized Prompt Wave & Sovereign Shield -->
  <g filter="url(#glow)">
    <!-- Palm / Leaf Energy Rays (Verdigris & Emerald) -->
    <path d="M 180 340 C 170 240, 230 180, 310 160 C 270 210, 260 270, 210 340 Z" fill="#20B2AA" fill-opacity="0.85" />
    <path d="M 230 350 C 240 230, 310 170, 370 180 C 330 230, 310 290, 260 360 Z" fill="#3EB991" fill-opacity="0.9" />
    <!-- Magenta Resonance Arc -->
    <path d="M 150 290 C 140 210, 190 140, 260 120 C 220 160, 210 220, 175 295 Z" fill="url(#magentaGlow)" fill-opacity="0.8" />
  </g>

  <!-- Central Prompt Terminal Chevron (P for Palmos & Prompt Execution) -->
  <g transform="translate(200, 200)">
    <path d="M 0 0 L 48 36 L 0 72 L 16 36 Z" fill="#F5FFFA" filter="drop-shadow(0 4px 12px rgba(224, 33, 138, 0.5))" />
    <rect x="56" y="56" width="36" height="8" rx="4" fill="#20B2AA" />
  </g>

  <!-- Bottom Indicator Pip -->
  <circle cx="256" cy="410" r="6" fill="#20B2AA" />
</svg>
